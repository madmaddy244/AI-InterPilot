<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InternPilot AI</title>
<meta name="description" content="Find internships, track applications, and prepare your application materials with InternPilot." />
<meta name="theme-color" content="#f7f6f2" />
<style>
:root{
  --bg:oklch(0.975 0.004 85);--panel:#fff;--side:oklch(0.955 0.005 85);--ink:oklch(0.22 0.01 85);--ink2:oklch(0.45 0.01 85);--ink3:oklch(0.6 0.008 85);
  --line:oklch(0.9 0.006 85);--line2:oklch(0.86 0.006 85);
  --acc:oklch(0.52 0.13 150);--acc-bg:oklch(0.95 0.04 150);
  --ok:oklch(0.58 0.13 150);--ok-bg:oklch(0.95 0.04 150);
  --warn:oklch(0.68 0.13 75);--warn-bg:oklch(0.96 0.045 85);
  --bad:oklch(0.58 0.15 25);--bad-bg:oklch(0.96 0.03 25);
  --info:oklch(0.55 0.11 250);--info-bg:oklch(0.95 0.03 250);
  --r:10px;--sans:'Geist',ui-sans-serif,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0}h2{font-size:14px;font-weight:600;margin:0}h3{margin:0;font-size:15px;font-weight:600}
p{margin:0;text-wrap:pretty}a{color:var(--acc)}
.mono{font-family:var(--mono)}.tiny{font-size:11px;letter-spacing:.02em}.small{font-size:13px}.muted{color:var(--ink2)}.err{color:var(--bad)}.ok-t{color:var(--ok)}.strong{font-weight:600}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none}.ico svg{display:block}
button{font:inherit;color:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

.shell{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500}
.brand-name{font-weight:600;letter-spacing:-.01em}.brand-sub{font-size:10px;color:var(--ink3)}
nav{display:flex;flex-direction:column;gap:1px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;color:var(--ink2);font-size:13.5px}
.nav:hover{background:oklch(0.92 0.006 85);color:var(--ink)}.nav.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px oklch(0 0 0/.04);font-weight:500}
.nav-count{margin-left:auto;font-size:11px;background:var(--line);border-radius:10px;padding:0 7px}
.side-foot{margin-top:auto}.powered{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.pw-row{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}.pw-row.sub{font-weight:400;color:var(--ink2);font-size:11px;padding-left:14px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}.dot-ok{background:var(--ok)}.dot-off{background:var(--ink3)}.dot-warn{background:var(--warn)}
.linkish{border:0;background:none;padding:0;color:var(--acc);text-align:left}.linkish:hover{text-decoration:underline}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line);background:oklch(0.975 0.004 85/.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.crumb{font-size:12px;color:var(--ink2)}.top-right{margin-left:auto}
.demo-pill{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;padding:4px 10px;border-radius:20px;background:var(--warn-bg);color:oklch(0.42 0.08 75);letter-spacing:.03em}
.hamb{display:none;border:0;background:none;padding:6px}
.content{padding:28px;max-width:1240px;width:100%}
.page{display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}.pagehead p{margin-top:4px}.pagehead-right{display:flex;gap:8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px oklch(0 0 0/.03)}.card-pad{padding:18px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}.card-h .linkish,.card-h>.mono:last-child{margin-left:auto}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.grid-2.wide-left{grid-template-columns:1.35fr 1fr}.grid-2.wide-right{grid-template-columns:1fr 1.5fr}

.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:oklch(0.97 0.004 85)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}.btn-primary:hover:not(:disabled){background:oklch(0.3 0.01 85)}
.btn-apply{border-color:var(--acc);background:var(--acc-bg);color:var(--acc);font-weight:600;text-decoration:none}.btn-apply:hover{background:oklch(0.91 0.05 150);color:var(--acc)}
.btn-ghost{border-color:transparent;background:none}.btn-sm{height:29px;padding:0 10px;font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:6px;background:oklch(0.95 0.005 85);color:var(--ink2);white-space:nowrap}
.tag.mono{font-family:var(--mono);font-size:10px;letter-spacing:.04em}
.tag-ok{background:var(--ok-bg);color:oklch(0.4 0.1 150)}.tag-bad{background:var(--bad-bg);color:oklch(0.45 0.13 25)}.tag-warn{background:var(--warn-bg);color:oklch(0.45 0.09 75)}
.sample-badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:2px 6px;border-radius:4px;border:1px dashed oklch(0.7 0.1 75);color:oklch(0.5 0.1 75);background:var(--warn-bg);white-space:nowrap}
.ring{position:relative;display:grid;place-items:center;flex:none}.ring svg{position:absolute;inset:0}.ring span{position:relative;font-weight:500}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--panel);padding:16px 18px}.stat-n{font-size:30px;font-weight:600;letter-spacing:-.03em;margin-top:6px}
.callout{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--acc-bg);border-color:oklch(0.88 0.06 150)}.callout .btn{margin-left:auto}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;border-radius:0}.row:first-child{border-top:0}.row:hover{background:oklch(0.98 0.003 85)}
.row-main{flex:1;min-width:0}.row-t{font-weight:500}
.pipe{display:flex;flex-direction:column;gap:8px}.pipe-row{display:grid;grid-template-columns:96px 1fr 24px;align-items:center;gap:10px}
.pipe-bar{height:6px;border-radius:3px;background:oklch(0.95 0.004 85);overflow:hidden}.pipe-bar div{height:100%;background:var(--ink);border-radius:3px;transition:width .3s}
.st{font-size:12px;display:inline-flex;align-items:center;gap:6px}.st::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.st-applied::before{background:var(--info)}.st-assessment::before{background:var(--warn)}.st-interview::before{background:oklch(0.55 0.13 300)}.st-offer::before{background:var(--ok)}.st-rejected::before{background:var(--bad)}.st-withdrawn::before{background:var(--line2)}
.dl{display:flex;gap:12px;padding:7px 0;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}.dl:first-of-type{border-top:0}.dl-t{font-size:13px}.dl:hover .dl-t{text-decoration:underline}

.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:9px;padding:4px 4px 4px 12px;background:var(--panel)}
.search input{flex:1;border:0;outline:0;background:none;height:34px;min-width:0}.search.sm{padding:2px 2px 2px 10px}.search.sm input{height:30px}
.search:focus-within{border-color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:oklch(0.98 0.003 85);border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--ink2)}.chip:hover{border-color:var(--ink3);color:var(--ink)}
.provider-note{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);font-size:12.5px;color:oklch(0.38 0.06 75)}.provider-note .ico{margin-top:2px}
.agent-results{order:-1}.agent-results .card-h{margin-bottom:4px}.agent-result-actions{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.apply-notice{display:flex;gap:9px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--info-bg);color:var(--ink2);font-size:13px}.apply-notice .ico{margin-top:2px}
.consent{display:flex;align-items:flex-start;gap:8px;color:var(--ink2);font-size:12px;line-height:1.4}.consent input{margin:2px 0 0;accent-color:var(--acc);flex:none}
.apply-link{width:100%;justify-content:center;text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.apply-role{display:flex;flex-direction:column;gap:16px;border-left:3px solid var(--acc)}
.apply-role-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}
.apply-role-heading select{width:min(520px,65%);height:36px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:var(--panel);font-size:13px}
.apply-role-summary{display:flex;align-items:center;gap:12px}
.apply-role-copy{min-width:0;flex:1}.apply-role-copy h2{font-size:18px;margin:0}.apply-role-copy p{margin:3px 0 0}
.apply-layout{display:grid;grid-template-columns:minmax(270px,.85fr) minmax(0,1.6fr);gap:18px;align-items:start}
.apply-steps{display:flex;flex-direction:column;gap:12px}
.apply-step{display:flex;flex-direction:column;align-items:stretch;gap:12px}
.apply-step-heading{display:flex;align-items:flex-start;gap:10px}
.apply-step-heading h2,.apply-packet-heading h2{font-size:15px;margin:0}
.apply-step-heading p{margin:3px 0 0}
.step-number{width:24px;height:24px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;flex:none;font:11px var(--mono);color:var(--ink2)}
.step-done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.apply-actions{display:flex;flex-direction:column;gap:9px}
.apply-packet{display:flex;flex-direction:column;gap:0;min-height:510px;overflow:hidden}
.apply-packet-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px;border-bottom:1px solid var(--line)}
.apply-packet-heading h2{margin-top:4px;font-size:17px}
.apply-doc-list{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));padding:10px 12px;border-bottom:1px solid var(--line);gap:6px;overflow:auto}
.apply-doc-option{display:flex;align-items:center;gap:6px;min-height:38px;padding:7px 9px;border:1px solid transparent;border-radius:7px;background:none;color:var(--ink2);font-size:11.5px;text-align:left;white-space:nowrap}
.apply-doc-option>.ico:last-child{margin-left:auto}
.apply-doc-option:hover{background:var(--side);color:var(--ink)}
.apply-doc-option.on{border-color:var(--line2);background:var(--side);color:var(--ink);font-weight:500}
.apply-doc-check{width:18px;height:18px;display:grid;place-items:center;flex:none;border:1px solid var(--line2);border-radius:50%;color:var(--ink3)}
.apply-doc-check.ready{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.apply-editor{display:flex;flex:1;flex-direction:column;min-height:0}
.apply-editor .doc{min-height:320px}
.apply-packet>.empty{margin:auto;padding:30px}
.filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filters select{height:32px;border:1px solid var(--line2);border-radius:8px;padding:0 8px;background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;padding:2px;background:var(--panel)}
.seg button{border:0;background:none;padding:4px 11px;border-radius:6px;font-size:12.5px;color:var(--ink2)}.seg button.on{background:var(--ink);color:var(--bg)}
.flt{display:flex;align-items:center;gap:8px}.flt input{accent-color:var(--ink);width:110px}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.job{padding:16px;display:flex;flex-direction:column;gap:12px}.job-top{display:flex;gap:12px;align-items:flex-start}.job-main{flex:1;min-width:0}
.job-t{border:0;background:none;padding:0;font-weight:600;font-size:15px;text-align:left}.job-t:hover{text-decoration:underline}
.skills-line{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.job-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}.job-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.skel-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}.skel{height:150px;border-radius:var(--r);background:linear-gradient(90deg,var(--line) 0%,oklch(0.95 0.004 85) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

.back{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.detail-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}.detail-head p{margin-top:4px}
.row-inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.score-hero{display:flex;gap:22px;align-items:flex-start}.factors{flex:1;display:flex;flex-direction:column;gap:10px}
.factor{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:10px}.factor-l{display:flex;justify-content:space-between;font-size:13px}
.factor-d{grid-column:1/-1;margin-top:-6px}.factor-pts{text-align:right}
.bar{height:6px;border-radius:3px;background:oklch(0.95 0.004 85);overflow:hidden}.bar div{height:100%;background:var(--ink);border-radius:3px;transition:width .3s}
.method{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2);color:var(--ink3)}
.sk-group{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.sk-group:last-child{margin-bottom:0}
.locked{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px dashed var(--line2);border-radius:8px}.locked>div{flex:1}.locked p{margin-top:2px}
.ev{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.ev:first-of-type{border-top:0}
.kv{display:grid;grid-template-columns:80px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.kv:first-of-type{margin-top:12px}
.prep{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

.banner{display:flex;align-items:center;gap:10px;font-size:13px;padding:10px 14px;border-radius:8px;background:var(--warn-bg)}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;background:oklch(0.985 0.003 85)}.drop:hover{border-color:var(--ink3)}
.st-line{display:flex;align-items:center;gap:8px;margin-top:12px}
.spin{width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--ink);border-radius:50%;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.priv{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.form2 label{display:flex;flex-direction:column;gap:4px}
.form2 input,.form3 input,.form-x input,.entry input,.entry textarea{border:1px solid var(--line2);border-radius:7px;padding:7px 10px;background:var(--panel);width:100%;min-width:0}
.form3{display:grid;grid-template-columns:2fr 2fr 1fr 28px;gap:8px;margin-bottom:8px}.form-x{display:grid;grid-template-columns:1fr 28px;gap:8px}
.entry{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}.entry .form3{margin:0}
.x{border:0;background:none;color:var(--ink3);font-size:18px}.x:hover{color:var(--bad)}
.le{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tag.editable{padding-right:4px}.tag.editable button{border:0;background:none;padding:0 3px;color:var(--ink3);font-size:14px;line-height:1}.tag.editable button:hover{color:var(--bad)}
.le-in{border:0;outline:0;background:none;font-size:12.5px;min-width:100px;flex:1;padding:2px}
.sub-h{display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px;border-top:1px solid var(--line)}
.profile-summary{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.profile-summary textarea,.resume-section textarea,.resume-raw textarea{width:100%;border:1px solid var(--line2);border-radius:7px;padding:8px 10px;background:var(--panel);font:13px/1.55 var(--sans);resize:vertical}
.resume-sections{margin-top:14px}
.resume-section{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px}
.resume-raw{margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:8px}
.resume-raw summary{cursor:pointer}
.resume-raw textarea{margin-top:10px;font-family:var(--mono);font-size:11.5px}

.resume-builder{display:grid;grid-template-columns:minmax(340px,.9fr) minmax(420px,1.1fr);gap:18px;align-items:start}
.resume-editor,.resume-preview-column{display:flex;flex-direction:column;gap:12px;min-width:0}
.resume-steps-card{padding:12px 14px}
.resume-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.resume-step{display:flex;align-items:center;gap:7px;padding:7px 5px;border:0;border-radius:7px;background:none;color:var(--ink2);text-align:left;font-size:11px;line-height:1.25}
.resume-step:hover{background:var(--side);color:var(--ink)}.resume-step.on{background:var(--acc-bg);color:var(--ink);font-weight:600}
.resume-step-number{width:20px;height:20px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:50%;font:10px var(--mono);flex:none}
.resume-step.done .resume-step-number{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.resume-step-progress{height:3px;background:var(--line);border-radius:3px;margin:10px 1px 0;overflow:hidden}.resume-step-progress span{height:100%;display:block;background:var(--acc);transition:width .2s}
.resume-form-card{padding:18px}
.resume-form-heading{margin-bottom:18px}.resume-form-heading h2{font-size:17px;margin:4px 0}.resume-form-heading p{line-height:1.5}
.resume-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.resume-fields label,.resume-field-full{display:flex;flex-direction:column;gap:5px;min-width:0}
.resume-fields input,.resume-field-full input,.resume-field-full textarea{width:100%;border:1px solid var(--line2);border-radius:7px;padding:8px 10px;background:var(--panel);font-size:13px}
.resume-field-full{margin-top:13px}.resume-field-full textarea{resize:vertical;line-height:1.5}
.resume-list-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 9px;padding-top:13px;border-top:1px solid var(--line)}
.resume-list-heading h3{font-size:13px}.resume-entry{border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:9px}
.resume-entry-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:12px;color:var(--ink2)}
.resume-entry .resume-field-full{margin-top:9px}
.resume-hint{padding:12px;border:1px dashed var(--line2);border-radius:8px;color:var(--ink2);font-size:12.5px}
.resume-cert-note{margin-top:8px}
.resume-style-options{display:grid;gap:8px}
.resume-style-option{display:flex;align-items:center;gap:11px;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:left}
.resume-style-option:hover{border-color:var(--line2);background:var(--side)}.resume-style-option.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:var(--acc-bg)}
.resume-style-option>span:nth-child(2){display:flex;flex:1;flex-direction:column;gap:2px}.resume-style-option small{color:var(--ink2);font-size:11px}.resume-style-option>.ico{color:var(--acc)}
.resume-style-swatch{width:38px;height:46px;padding:8px 5px;border:1px solid var(--line2);border-radius:3px;background:white;display:flex;flex-direction:column;gap:4px;flex:none}
.resume-style-swatch i{display:block;height:2px;background:var(--line2);border-radius:2px}.resume-style-swatch i:first-child{height:4px;width:70%;background:var(--ink)}.resume-style-swatch.modern{border-top:4px solid var(--acc)}.resume-style-swatch.classic i:first-child{width:100%;background:#333}.resume-style-swatch.compact{gap:2px;padding-top:6px}.resume-style-swatch.compact i{height:1px}
.resume-section-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.resume-section-options label{display:flex;align-items:center;gap:7px;font-size:12px}.resume-section-options label.disabled{color:var(--ink3)}
.resume-section-options input{accent-color:var(--acc)}
.resume-print-hint{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:10px;border-radius:7px;background:var(--info-bg);color:var(--ink2);font-size:11.5px;line-height:1.45}.resume-print-hint .ico{margin-top:1px;flex:none}
.resume-final-actions,.resume-step-actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.resume-preview-toolbar{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}.resume-preview-toolbar>div{display:flex;align-items:center;gap:10px}
.resume-preview-status{display:flex;align-items:center;gap:5px;color:var(--ink3);font-size:10px}.resume-preview-status i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.resume-paper{width:100%;max-width:210mm;min-height:297mm;margin:0 auto;padding:34px 38px;background:#fff;color:#202321;border:1px solid var(--line);box-shadow:0 3px 16px oklch(0 0 0/.08);font:11px/1.48 Arial,sans-serif;overflow-wrap:anywhere}
.resume-paper-header{padding-bottom:14px;border-bottom:2px solid #3e7759;margin-bottom:15px}
.resume-paper-header h1{font:700 26px/1.15 Arial,sans-serif;letter-spacing:-.02em;color:#202321}
.resume-paper-headline{font-size:13px;color:#49735b;margin-top:4px}
.resume-paper-contact{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:8px;color:#545b56;font-size:9px}
.resume-paper-contact a{color:inherit;text-decoration:none}
.resume-paper-section{margin:0 0 14px;break-inside:avoid}.resume-paper-section h2{font:bold 11px/1.3 Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#3e7759;border-bottom:1px solid #dce5df;padding-bottom:4px;margin:0 0 7px}
.resume-paper-section p{margin:3px 0;white-space:pre-line}
.resume-paper-entry{margin:0 0 8px;break-inside:avoid}.resume-paper-entry-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.resume-paper-entry-top b{font-size:11px}.resume-paper-entry-top span{color:#69716c;font-size:9px;text-align:right}
.resume-paper-subtitle{color:#58635d;font-style:italic;margin-top:1px}.resume-paper-project-skills{color:#5e6a63;font-size:9px;margin-top:3px}
.resume-paper-preserved{white-space:pre-line}
.resume-paper-empty-hint{padding:9px;border:1px dashed #cbd2cd;color:#7b827d;font-style:italic;font-size:10px}
.resume-classic{font-family:Georgia,'Times New Roman',serif;font-size:11.5px}.resume-classic .resume-paper-header{text-align:center;border-bottom:1px solid #333}.resume-classic .resume-paper-header h1{font:700 25px Georgia,'Times New Roman',serif}.resume-classic .resume-paper-headline,.resume-classic .resume-paper-section h2{color:#333}.resume-classic .resume-paper-contact{justify-content:center}.resume-classic .resume-paper-section h2{border-color:#777}
.resume-compact{padding:26px 30px;font-size:10px;line-height:1.38}.resume-compact .resume-paper-header{padding-bottom:10px;margin-bottom:10px}.resume-compact .resume-paper-header h1{font-size:23px}.resume-compact .resume-paper-section{margin-bottom:9px}.resume-compact .resume-paper-entry{margin-bottom:5px}.resume-compact .resume-paper-section h2{margin-bottom:5px}

.studio{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.studio-side{display:flex;flex-direction:column;gap:10px;align-items:flex-start}.studio-side select{width:100%;height:34px;border:1px solid var(--line2);border-radius:8px;padding:0 8px;background:var(--panel)}
.studio-meta{display:flex;gap:10px;align-items:center}
.sep{height:1px;background:var(--line);width:100%;margin:4px 0}
.gen-opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.gen-opt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}.gen-opt:disabled{opacity:.55;cursor:not-allowed}.gen-opt .ico{margin-top:2px}
.studio-main{min-height:520px;display:flex;flex-direction:column}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 10px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.doc-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 0}
.doc{flex:1;border:0;outline:0;resize:none;padding:14px 18px;font-size:14px;line-height:1.65;min-height:380px;background:none}
.doc-actions{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.studio-main .empty{margin:auto}

.tbl{display:flex;flex-direction:column}.tr{display:grid;grid-template-columns:1.6fr 130px 90px 90px 90px 1.2fr 70px;gap:12px;padding:11px 16px;align-items:center;border-top:1px solid var(--line)}
.tr.th{border-top:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink3);text-transform:uppercase;padding:10px 16px}
.st-sel{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12.5px;background:var(--panel);width:100%}
.note-in{border:1px solid transparent;border-radius:6px;padding:4px 6px;width:100%;background:none;font-size:12.5px}.note-in:hover,.note-in:focus{border-color:var(--line2);outline:0}
.tr-act{display:flex;gap:2px;justify-content:flex-end}.icon-btn{border:0;background:none;padding:6px;border-radius:6px;color:var(--ink2)}.icon-btn:hover{background:oklch(0.95 0.004 85);color:var(--ink)}.icon-btn.danger:hover{color:var(--bad);background:var(--bad-bg)}
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.lane{background:oklch(0.96 0.004 85);border-radius:var(--r);padding:10px;min-height:280px;display:flex;flex-direction:column;gap:8px}.lane-h{display:flex;justify-content:space-between;padding:2px 2px 6px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab}

.task{width:100%;border:1px solid var(--line2);border-radius:8px;padding:10px;margin:6px 0 10px;resize:vertical}
.alog{display:flex;flex-direction:column}.alog-r{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);animation:fi .25s}.alog-r:first-child{border-top:0}
@keyframes fi{from{opacity:0;transform:translateY(3px)}}
.alog-i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px}.alog-i.ok{background:var(--ok-bg);color:var(--ok)}.alog-i.bad{background:var(--bad-bg);color:var(--bad)}.alog-i.skip{background:oklch(0.95 0.004 85);color:var(--ink3)}
.tool{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}.tool:first-of-type{border-top:0}.tool .muted{grid-column:1}.tool .tag{grid-row:1/3;grid-column:2;align-self:center}

.integ{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}.integ:first-child{border-top:0;padding-top:0}.integ:last-child{padding-bottom:0}
.integ-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.envs{display:flex;flex-wrap:wrap;gap:6px}.env{background:oklch(0.96 0.004 85);padding:2px 7px;border-radius:5px}
.wt{display:grid;grid-template-columns:130px 1fr 28px;gap:12px;align-items:center;padding:6px 0}.wt input{accent-color:var(--ink)}

.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:48px 20px}.empty p{max-width:340px}.empty .btn{margin-top:6px}
.empty-ico{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:4px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;display:flex;gap:8px;align-items:center;z-index:50;animation:fi .2s}
.scrim{display:none}
.privacy-notice{position:fixed;z-index:40;left:24px;right:24px;bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:18px;max-width:900px;margin:0 auto;padding:15px 18px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);box-shadow:0 8px 32px oklch(0 0 0/.14)}
.privacy-notice>div:first-child{display:grid;gap:4px}.privacy-notice p{color:var(--ink2);max-width:620px}
.privacy-notice-actions{display:flex;flex:none;gap:8px}
.not-found,.fatal-error{min-height:55vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;max-width:560px;margin:0 auto}
.not-found h1,.fatal-error h1{font-size:clamp(28px,5vw,44px)}
.not-found .btn,.fatal-error .btn{margin-top:4px}
.fatal-error{padding:24px}
.integration-skeleton{display:grid;gap:9px;margin:10px 0}
.skel-line{display:block;width:75%;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--line) 0%,oklch(0.95 0.004 85) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
.skel-line-short{width:38%}
.skel-status{font-size:11px;color:var(--ink3);margin-left:auto}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

@media (max-width:1000px){.grid-2,.grid-2.wide-left,.grid-2.wide-right,.studio,.apply-layout{grid-template-columns:1fr}.jobs,.skel-list{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}
  .resume-builder{grid-template-columns:1fr}.resume-preview-column{order:-1}.resume-paper{min-height:unset}
  .tr{grid-template-columns:1fr 120px 60px}.tr>span:nth-child(3),.tr>span:nth-child(4),.tr>span:nth-child(5),.tr>span:nth-child(6){display:none}}
@media (max-width:760px){.side{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:oklch(0 0 0/.25);z-index:20}.hamb{display:block}.content{padding:18px}.topbar{padding:0 14px}.demo-pill{font-size:9.5px}
  .privacy-notice{left:10px;right:10px;bottom:10px;align-items:stretch;flex-direction:column;gap:12px;padding:14px}.privacy-notice-actions{justify-content:flex-end}
  .factor{grid-template-columns:110px 1fr 44px}.score-hero{flex-direction:column}.form2,.form3{grid-template-columns:1fr}.form3 .x{justify-self:end}
  .resume-fields{grid-template-columns:1fr}.resume-paper{padding:24px 20px}.resume-steps{grid-template-columns:1fr 1fr}.resume-step{font-size:10.5px}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .side,.topbar,.resume-builder-page>.pagehead,.resume-editor,.resume-preview-toolbar,.toast,.privacy-notice{display:none!important}
  .shell,.main,.content,.resume-builder-page,.resume-builder,.resume-preview-column{display:block!important;width:auto!important;max-width:none!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important;background:#fff!important}
  .resume-builder-page,.resume-builder-page *{visibility:visible}
  .resume-preview-column{break-inside:avoid}
  .resume-paper{width:auto!important;max-width:none!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important;overflow:visible!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .resume-paper-section,.resume-paper-entry{break-inside:avoid}
}
</style>
